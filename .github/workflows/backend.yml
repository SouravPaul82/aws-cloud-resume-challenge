name: Deploy Backend

# Trigger: runs only when backend files change, on push to main
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # Match your Lambda runtime

      - name: Install dependencies
        run: |
          pip install boto3 pytest

      # Run your unit tests BEFORE deploying — fail fast
      - name: Run tests
        run: |
          pytest backend/test_lambda.py -v

  deploy:
    name: Deploy Lambda function
    runs-on: ubuntu-latest
    needs: test   # Only runs if the test job passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
   
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Zip the Lambda code — AWS requires a zip file for deployment
      - name: Package Lambda
        run: |
          cd backend
          zip -r lambda.zip lambda_function.py

      # Upload the new zip to Lambda
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://backend/lambda.zip